name: Latest blog posts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.konataizumi.com/rss.xml"
          max_post_count: 4
          template: "- [$title]($url) <sub>$date</sub>$newline"
          date_format: "yyyy-mm-dd"
          commit_message: "存活报告：同步最新文章"
