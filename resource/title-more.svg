    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".18" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="1" y2="0">
