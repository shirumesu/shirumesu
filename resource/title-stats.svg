<svg xmlns="http://www.w3.org/2000/svg" width="302.6" height="64" viewBox="0 0 302.6 64" role="img" aria-label="github stats">
  <style>
    .spin { animation: spin 20s linear infinite; }
    .twinkle { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 4s ease-in-out infinite; }
    .sway { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .wobble { animation: wobble 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 90%; }
    .nudge { animation: nudge 1.6s ease-in-out infinite; }
    .pop { animation: pop .7s cubic-bezier(.2, .8, .3, 1.25) both; }
    .stamp { animation: stamp .5s cubic-bezier(.3, 1.5, .5, 1) both; transform-box: fill-box; transform-origin: center; }
    .sweep { animation: sweep .7s ease-out both; transform-box: fill-box; transform-origin: left center; }
    .draw { stroke-dasharray: 1000; animation: draw 1.1s ease-out both; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.55); opacity: .45; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(-.3deg); } }
    @keyframes wobble { from { transform: rotate(-8deg); } to { transform: rotate(-2deg); } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes stamp { from { opacity: 0; transform: scale(1.5) rotate(4deg); } to { opacity: 1; transform: none; } }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs><pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="#ffffff" opacity="0.35"/>
    </pattern></defs>
