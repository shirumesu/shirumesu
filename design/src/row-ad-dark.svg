<svg xmlns="http://www.w3.org/2000/svg" width="293" height="128" viewBox="0 0 293 128" role="img" aria-label="广告位招租 — 虚位以待（赞助商标志纯属娱乐）">
  <style>
    .drift { animation: drift 22s ease-in-out infinite; }
    .drift2 { animation: drift2 28s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(36px, 14px); } }
    @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, -10px); } }
    .sweep { animation: sweep .9s cubic-bezier(.3, .7, .2, 1) both; transform-box: fill-box; transform-origin: left center; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .flow { stroke-dasharray: 4 6; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .fade { animation: fade .8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .blink { animation: blink 3.2s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes twinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(.5); } }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw, .ink { stroke-dashoffset: 0 !important; } }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CC6DC" stop-opacity=".045"/><stop offset=".6" stop-color="#6CC6DC" stop-opacity="0"/><stop offset="1" stop-color="#F4D35E" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="gSea"><stop offset="0" stop-color="#6CC6DC" stop-opacity=".11"/><stop offset="1" stop-color="#6CC6DC" stop-opacity="0"/></radialGradient>
    <radialGradient id="gSun"><stop offset="0" stop-color="#F4D35E" stop-opacity=".1"/><stop offset="1" stop-color="#F4D35E" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4C55"/><stop offset=".18" stop-color="#3A4C55" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4D35E" stop-opacity=".34"/><stop offset=".9" stop-color="#F4D35E" stop-opacity=".26"/><stop offset="1" stop-color="#F4D35E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r=".9" fill="#DCE8EC" fill-opacity=".14"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .86  0 0 0 0 .92  0 0 0 0 .95  .09 0 0 0 -.025"/>
    </filter>
    
  </defs>
  <clipPath id="tad"><rect x="8" y="4" width="277" height="120" rx="8"/></clipPath>
  <g clip-path="url(#tad)">
    <rect x="8" y="4" width="277" height="120" fill="#0F1A20"/><rect x="8" y="4" width="277" height="120" fill="url(#wash)"/>
    <g class="drift"><circle cx="250" cy="130" r="120" fill="url(#gSun)"/></g>
  </g>
  <rect x="8.5" y="4.5" width="276" height="119" rx="7.5" fill="none" stroke="#DCE8EC" stroke-opacity=".1"/>
  <rect x="9.5" y="5.5" width="274" height="117" rx="6.5" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
  <text x="31" y="36" font-size="12" fill="#DCE8EC" letter-spacing="2" fill-opacity=".62">SPONSORED</text>
  <text x="262" y="36" font-size="12" fill="#6CC6DC" text-anchor="end">虚位以待</text>
  <g transform="rotate(0 29 64)"><rect class="sweep" style="animation-delay:0.3s" x="29" y="64" width="106.0" height="10" rx="5.0" fill="url(#marker)"/></g>
  <text x="31" y="76" font-size="20" fill="#DCE8EC" data-w="m">广告位招租</text>
  <text x="31" y="103" font-size="12" fill="#DCE8EC" letter-spacing="0.5" fill-opacity=".62">trusted by</text>
  <circle cx="108" cy="99" r="6.6" fill="none" stroke="#4285F4" stroke-width="3" stroke-dasharray="5.53 41.47" stroke-dashoffset="-0.00"/>
  <circle cx="108" cy="99" r="6.6" fill="none" stroke="#34A853" stroke-width="3" stroke-dasharray="10.60 41.47" stroke-dashoffset="-5.53"/>
  <circle cx="108" cy="99" r="6.6" fill="none" stroke="#FBBC05" stroke-width="3" stroke-dasharray="8.52 41.47" stroke-dashoffset="-16.13"/>
  <circle cx="108" cy="99" r="6.6" fill="none" stroke="#EA4335" stroke-width="3" stroke-dasharray="11.98 41.47" stroke-dashoffset="-24.65"/>
  <rect x="108" y="97.5" width="8.1" height="3" fill="#4285F4"/>
  <rect x="124.0" y="92.0" width="6.6" height="6.6" fill="#F25022"/>
  <rect x="131.4" y="92.0" width="6.6" height="6.6" fill="#7FBA00"/>
  <rect x="124.0" y="99.4" width="6.6" height="6.6" fill="#00A4EF"/>
  <rect x="131.4" y="99.4" width="6.6" height="6.6" fill="#FFB900"/>
  <rect x="148" y="91.5" width="15" height="15" rx="3" fill="none" stroke="#DCE8EC" stroke-opacity=".35" stroke-dasharray="2 2"/>
  <text x="155.5" y="103" font-size="12" fill="#DCE8EC" text-anchor="middle" fill-opacity=".62">?</text>
  <text x="262" y="103" font-size="12" fill="#DCE8EC" text-anchor="end" fill-opacity=".62">*纯属虚构</text>
</svg>
