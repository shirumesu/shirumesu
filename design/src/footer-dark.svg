<svg xmlns="http://www.w3.org/2000/svg" width="880" height="136" viewBox="0 0 880 136" role="img" aria-label="© 2006 ~ 2026 埼玉 · 糟日部 · 陵樱学园高等部 / SOS团 @shirumesu">
  <style>
    .drift { animation: drift 22s ease-in-out infinite; }
    .drift2 { animation: drift2 28s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(36px, 14px); } }
    @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, -10px); } }
    .sweep { animation: sweep .9s cubic-bezier(.3, .7, .2, 1) both; transform-box: fill-box; transform-origin: left center; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .flow { stroke-dasharray: 4 6; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .fade { animation: fade .8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .blink { animation: blink 3.2s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes twinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(.5); } }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw, .ink { stroke-dashoffset: 0 !important; } }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CC6DC" stop-opacity=".045"/><stop offset=".6" stop-color="#6CC6DC" stop-opacity="0"/><stop offset="1" stop-color="#F4D35E" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="gSea"><stop offset="0" stop-color="#6CC6DC" stop-opacity=".11"/><stop offset="1" stop-color="#6CC6DC" stop-opacity="0"/></radialGradient>
    <radialGradient id="gSun"><stop offset="0" stop-color="#F4D35E" stop-opacity=".1"/><stop offset="1" stop-color="#F4D35E" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4C55"/><stop offset=".18" stop-color="#3A4C55" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4D35E" stop-opacity=".34"/><stop offset=".9" stop-color="#F4D35E" stop-opacity=".26"/><stop offset="1" stop-color="#F4D35E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r=".9" fill="#DCE8EC" fill-opacity=".14"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .86  0 0 0 0 .92  0 0 0 0 .95  .09 0 0 0 -.025"/>
    </filter>
    
  </defs>
  <clipPath id="tf"><rect x="8" y="1" width="864" height="134" rx="8"/></clipPath>
  <g clip-path="url(#tf)">
    <rect x="8" y="1" width="864" height="134" fill="#0F1A20"/><rect x="8" y="1" width="864" height="134" fill="url(#wash)"/>
    <rect x="8" y="1" width="864" height="134" fill="url(#dots)"/><g class="drift"><circle cx="800" cy="70" r="170" fill="url(#gSea)"/></g>
  </g>
  <rect x="8.5" y="1.5" width="863" height="133" rx="7.5" fill="none" stroke="#DCE8EC" stroke-opacity=".1"/>
  <rect x="9.5" y="2.5" width="861" height="131" rx="6.5" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
  <text x="34" y="50" font-size="20" fill="#DCE8EC" data-w="m" letter-spacing="1">© 2006 ~ 2026</text>
  <text x="34" y="78" font-size="15" fill="#DCE8EC" letter-spacing="0.5" fill-opacity=".86">埼玉・糟日部・陵樱学园高等部 / SOS团</text>
  <text x="82" y="100" font-size="12" fill="#DCE8EC" text-anchor="middle" letter-spacing="2" fill-opacity=".7">konakona</text>
  <text x="34" y="120" font-size="15" fill="#6CC6DC" data-w="m">@shirumesu</text>
  <path class="draw" d="M32 127 C 56 124 96 128 132 125" fill="none" stroke="#6CC6DC" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="716" y1="22" x2="716" y2="114" stroke="#DCE8EC" stroke-opacity=".12" stroke-dasharray="3 4"/>
  <image href="@img/sos-logo.webp" x="759" y="14" width="87" height="108"/>
</svg>
