<svg xmlns="http://www.w3.org/2000/svg" width="587" height="300" viewBox="0 0 587 300" role="img" aria-label="MelonBanG — 主项目">
  <style>
    .drift { animation: drift 22s ease-in-out infinite; }
    .drift2 { animation: drift2 28s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(36px, 14px); } }
    @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, -10px); } }
    .sweep { animation: sweep .9s cubic-bezier(.3, .7, .2, 1) both; transform-box: fill-box; transform-origin: left center; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .flow { stroke-dasharray: 4 6; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .fade { animation: fade .8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .blink { animation: blink 3.2s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes twinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(.5); } }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw, .ink { stroke-dashoffset: 0 !important; } }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#177F98" stop-opacity=".045"/><stop offset=".6" stop-color="#177F98" stop-opacity="0"/><stop offset="1" stop-color="#F4D35E" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="gSea"><stop offset="0" stop-color="#177F98" stop-opacity=".11"/><stop offset="1" stop-color="#177F98" stop-opacity="0"/></radialGradient>
    <radialGradient id="gSun"><stop offset="0" stop-color="#F4D35E" stop-opacity=".2"/><stop offset="1" stop-color="#F4D35E" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".18" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4D35E" stop-opacity=".75"/><stop offset=".9" stop-color="#F4D35E" stop-opacity=".6"/><stop offset="1" stop-color="#F4D35E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r=".9" fill="#1F3A4A" fill-opacity=".14"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .12  0 0 0 0 .23  0 0 0 0 .29  .12 0 0 0 -.035"/>
    </filter>
    
  </defs>
  <clipPath id="th"><rect x="8" y="4" width="571" height="292" rx="8"/></clipPath>
  <g clip-path="url(#th)">
    <rect x="8" y="4" width="571" height="292" fill="#FAFCFB"/><rect x="8" y="4" width="571" height="292" fill="url(#wash)"/>
    <g class="drift2"><circle cx="470" cy="70" r="150" fill="url(#gSea)"/></g><rect x="330" y="-30" width="210" height="190" rx="14" fill="#FFFFFF" fill-opacity=".38" stroke="#FFFFFF" stroke-opacity=".9" transform="rotate(14 435 65)"/><rect x="402" y="26" width="160" height="150" rx="12" fill="#FFFFFF" fill-opacity=".3" stroke="#177F98" stroke-opacity=".12" transform="rotate(-8 482 101)"/>
  </g>
  <rect x="8.5" y="4.5" width="570" height="291" rx="7.5" fill="none" stroke="#1F3A4A" stroke-opacity=".1"/>
  <rect x="9.5" y="5.5" width="568" height="289" rx="6.5" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
  <g transform="rotate(0 32 31)"><rect class="sweep" style="animation-delay:0.3s" x="32" y="31" width="112" height="10" rx="5.0" fill="url(#marker)"/></g>
  <text x="34" y="38" font-size="12" fill="#1F3A4A" data-w="m" letter-spacing="2">MAIN PROJECT</text>
  <image href="@img/melonbang-icon.svg" x="34" y="70" width="52" height="52"/>
  <text x="100" y="108" font-size="32" fill="#1F3A4A" data-w="m">MelonBanG</text>
  <text x="34" y="162" font-size="15" fill="#1F3A4A" fill-opacity=".86">得意之作！基于 Bangumi 的追番播放器</text>
  <rect x="34" y="184" width="68" height="26" rx="13" fill="none" stroke="#1F3A4A" stroke-opacity=".2"/>
  <text x="68.0" y="201.5" font-size="12" fill="#1F3A4A" text-anchor="middle">多源聚合</text>
  <rect x="110.0" y="184" width="68" height="26" rx="13" fill="none" stroke="#1F3A4A" stroke-opacity=".2"/>
  <text x="144.0" y="201.5" font-size="12" fill="#1F3A4A" text-anchor="middle">混合弹幕</text>
  <rect x="186.0" y="184" width="68" height="26" rx="13" fill="none" stroke="#1F3A4A" stroke-opacity=".2"/>
  <text x="220.0" y="201.5" font-size="12" fill="#1F3A4A" text-anchor="middle">内置下载</text>
  <rect x="262.0" y="184" width="56" height="26" rx="13" fill="none" stroke="#1F3A4A" stroke-opacity=".2"/>
  <text x="290.0" y="201.5" font-size="12" fill="#1F3A4A" text-anchor="middle">跨平台</text>
  <line x1="34" y1="242" x2="553" y2="242" stroke="#1F3A4A" stroke-opacity=".1"/>
  <text x="34" y="270" font-size="12" fill="#1F3A4A" letter-spacing="0.5" fill-opacity=".62">Dart · Flutter</text>
  <text x="553" y="270" font-size="12" fill="#177F98" text-anchor="end">shirumesu/MelonBanG ↗</text>
  <line class="flow" x1="565" y1="150" x2="587" y2="150" stroke="#177F98" stroke-width="1.6"/>
  <circle cx="565" cy="150" r="3" fill="#177F98"/>
</svg>
