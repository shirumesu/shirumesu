<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-label="吾辈是希露梅斯，别看我这样子，其实我之前是个二次元.jpg">
  <style>
    .drift { animation: drift 22s ease-in-out infinite; }
    .drift2 { animation: drift2 28s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(36px, 14px); } }
    @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, -10px); } }
    .sweep { animation: sweep .9s cubic-bezier(.3, .7, .2, 1) both; transform-box: fill-box; transform-origin: left center; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .flow { stroke-dasharray: 4 6; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .fade { animation: fade .8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .blink { animation: blink 3.2s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes twinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(.5); } }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#177F98" stop-opacity=".045"/><stop offset=".6" stop-color="#177F98" stop-opacity="0"/><stop offset="1" stop-color="#F4D35E" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="gSea"><stop offset="0" stop-color="#177F98" stop-opacity=".11"/><stop offset="1" stop-color="#177F98" stop-opacity="0"/></radialGradient>
    <radialGradient id="gSun"><stop offset="0" stop-color="#F4D35E" stop-opacity=".2"/><stop offset="1" stop-color="#F4D35E" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".18" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4D35E" stop-opacity=".75"/><stop offset=".9" stop-color="#F4D35E" stop-opacity=".6"/><stop offset="1" stop-color="#F4D35E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r=".9" fill="#1F3A4A" fill-opacity=".14"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .12  0 0 0 0 .23  0 0 0 0 .29  .12 0 0 0 -.035"/>
    </filter>
    <clipPath id="ph"><rect x="595" y="1" width="277" height="402" rx="8"/></clipPath><linearGradient id="phFade" x1="0" y1="0" x2="0" y2="1"><stop offset=".7" stop-color="#FAFCFB" stop-opacity="0"/><stop offset="1" stop-color="#FAFCFB" stop-opacity=".35"/></linearGradient>
  </defs>
  <clipPath id="ta"><rect x="8" y="1" width="571" height="262" rx="8"/></clipPath>
  <g clip-path="url(#ta)">
    <rect x="8" y="1" width="571" height="262" fill="#FAFCFB"/><rect x="8" y="1" width="571" height="262" fill="url(#wash)"/>
    <rect x="8" y="1" width="571" height="262" fill="url(#dots)"/><g class="drift"><circle cx="520" cy="20" r="220" fill="url(#gSea)"/></g>
  </g>
  <rect x="8.5" y="1.5" width="570" height="261" rx="7.5" fill="none" stroke="#1F3A4A" stroke-opacity=".1"/>
  <rect x="9.5" y="2.5" width="568" height="259" rx="6.5" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
  <text x="34" y="36" font-size="12" fill="#177F98" data-w="m" letter-spacing="2">INTRO</text>
  <text x="34" y="74" font-size="20" data-w="m"><tspan fill="#1F3A4A">吾辈是</tspan><tspan fill="#177F98">希露梅斯</tspan><tspan fill="#1F3A4A">，</tspan></text>
  <text x="34" y="108" font-size="15" fill="#1F3A4A" data-maxw="520" fill-opacity=".86">别看我这样子，其实我之前是个二次元.jpg</text>
  <text x="34" y="134" font-size="15" fill="#1F3A4A" data-maxw="520" fill-opacity=".86">虽然从来没有认可过自己的技术……但姑且就认为是技术宅吧！</text>
  <text x="34" y="160" font-size="15" fill="#1F3A4A" data-maxw="520" fill-opacity=".86">毕竟去异世界这种事说不定也会发生哦</text>
  <text x="34" y="198" font-size="15" fill="#1F3A4A" data-maxw="520" fill-opacity=".86">总而言之，我在做一些有趣的事，让我觉得开心的事</text>
  <text x="34" y="224" font-size="15" fill="#1F3A4A" data-maxw="520" fill-opacity=".86">如果让你也觉得有趣就再好不过了。</text>
  <g transform="rotate(3 489.0 211.0)"><rect x="418" y="180" width="142" height="62" fill="#F4D35E" fill-opacity=".55"/><rect x="467.0" y="173" width="44" height="14" fill="#FAFCFB" fill-opacity=".85" stroke="#1F3A4A" stroke-opacity=".08"/></g>
  <g transform="rotate(3 489 211)"><text x="430" y="205" font-size="12" fill="#1F3A4B" data-w="m">The truth shall make</text><text x="430" y="221" font-size="12" fill="#1F3A4B" data-w="m">you free.</text><text x="548" y="236" font-size="12" fill="#1F3A4B" text-anchor="end" fill-opacity=".62">John 8:32</text></g>
  <g clip-path="url(#ph)"><image href="@img/konata.gif" x="595" y="1" width="277" height="402" preserveAspectRatio="xMidYMid slice"/><rect x="595" y="1" width="277" height="402" fill="url(#phFade)"/></g>
  <rect x="595.5" y="1.5" width="276" height="401" rx="7.5" fill="none" stroke="#1F3A4A" stroke-opacity=".1"/>
  <rect x="596.5" y="2.5" width="274" height="399" rx="6.5" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
  <clipPath id="ts"><rect x="8" y="279" width="571" height="124" rx="8"/></clipPath>
  <g clip-path="url(#ts)">
    <rect x="8" y="279" width="571" height="124" fill="#FAFCFB"/><rect x="8" y="279" width="571" height="124" fill="url(#wash)"/>
    <g class="drift2"><circle cx="560" cy="420" r="220" fill="url(#gSun)"/></g>
  </g>
  <rect x="8.5" y="279.5" width="570" height="123" rx="7.5" fill="none" stroke="#1F3A4A" stroke-opacity=".1"/>
  <rect x="9.5" y="280.5" width="568" height="121" rx="6.5" fill="none" stroke="url(#rim)" stroke-width="1.2"/>
  <text x="34" y="322" font-size="12" fill="#177F98" data-w="m" letter-spacing="2">STACK</text>
  <circle cx="38" cy="357" r="3.5" fill="#177F98"/>
  <text x="50" y="362" font-size="20" fill="#1F3A4A">Dart</text>
  <circle cx="125.86000000000001" cy="357" r="3.5" fill="#177F98"/>
  <text x="137.86" y="362" font-size="20" fill="#1F3A4A">Python</text>
  <circle cx="236.18" cy="357" r="3.5" fill="#177F98"/>
  <text x="248.18" y="362" font-size="20" fill="#1F3A4A">TypeScript</text>
  <circle cx="381.46" cy="357" r="3.5" fill="#177F98"/>
  <text x="393.46" y="362" font-size="20" fill="#1F3A4A">C++</text>
  <circle cx="465.52" cy="357" r="3.5" fill="#177F98"/>
  <text x="477.52" y="362" font-size="20" fill="#1F3A4A">C#</text>
</svg>
