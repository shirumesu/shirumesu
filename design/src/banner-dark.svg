  <g class="pop" style="animation-delay:1.18s"><text x="112" y="230" font-size="48" fill="#DCE8EC" data-w="m" letter-spacing="1">計画通り…</text></g>
  <g class="pop" style="animation-delay:0.88s"><text x="408" y="196" font-size="15" fill="#6CC6DC">原来你真是美发师啊</text></g>
  <g transform="rotate(-3 735 206)"><rect x="626" y="188" width="218" height="34" fill="#6CC6DC" fill-opacity=".12"/><g class="pop" style="animation-delay:1.48s"><text x="735" y="212" font-size="18" fill="#DCE8EC" text-anchor="middle" letter-spacing="2">EL PSY CONGROO</text></g></g>
  <g transform="rotate(-2 510 242)"><g class="pop" style="animation-delay:1.00s"><text x="420" y="250" font-size="23" fill="#DCE8EC">你这家伙在看我吧</text></g></g>
  <g class="pop" style="animation-delay:1.06s"><text x="642" y="262" font-size="16" fill="#6CC6DC">秀吉的性别是秀吉啊!</text></g>
  <g class="pop" style="animation-delay:0.10s"><text x="113" y="250" font-size="14" fill="#DCE8EC" letter-spacing="1" fill-opacity=".62" data-v="1">吾且问，汝为人乎</text></g>
  <g class="pop" style="animation-delay:0.46s"><text x="140" y="276" font-size="14" fill="#DCE8EC" fill-opacity=".62">立于浮华之世，奏响天籁之音。</text></g>
  <g class="pop" style="animation-delay:1.36s"><text x="140" y="310" font-size="19" fill="#DCE8EC">为了我，成为炎拳吧</text></g>
  <g class="pop" style="animation-delay:0.76s"><text x="138" y="340" font-size="15" fill="#6CC6DC">家庭教师是你真的太好了</text></g>
