  <g transform="rotate(2 712 323)"><g class="pop" style="animation-delay:1.30s"><text x="712" y="330" font-size="19" fill="#1F3A4B" text-anchor="middle">放課後ティータイム</text></g></g>
  <g class="pop" style="animation-delay:0.82s"><text x="322" y="370" font-size="29" fill="#6CC6DC" letter-spacing="0.5">貧乳はステータスだ、希少価値だ!</text></g>
