  <path class="draw" style="animation-delay:.9s" d="M106 70 C 200 64 330 72 450 66 S 540 64 562 68" fill="none" stroke="#6CC6DC" stroke-width="2.2" stroke-linecap="round"/>
  <g class="pop" style="animation-delay:0.64s"><text x="106" y="58" font-size="29" fill="#DCE8EC" data-w="m" letter-spacing="0.5">ただの人間には興味ありません!</text></g>
  <g class="pop" style="animation-delay:0.40s"><text x="142" y="92" font-size="12.5" fill="#DCE8EC" fill-opacity=".62">你能回到过去拯救那个没被 QB 欺骗的我吗</text></g>
  <g class="pop" style="animation-delay:1.42s"><text x="582" y="30" font-size="17" fill="#6CC6DC" letter-spacing="1" data-v="1">一即是全，全即是一</text></g>
  <g class="pop" style="animation-delay:0.58s"><text x="620" y="92" font-size="16" fill="#DCE8EC" fill-opacity=".62">晚安，Sion</text></g>
