<svg xmlns="http://www.w3.org/2000/svg" width="880" height="56" viewBox="0 0 880 56" role="img" aria-label="github stats">
  <style>
    .drift { animation: drift 22s ease-in-out infinite; }
    .drift2 { animation: drift2 28s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(36px, 14px); } }
    @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, -10px); } }
    .sweep { animation: sweep .9s cubic-bezier(.3, .7, .2, 1) both; transform-box: fill-box; transform-origin: left center; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .flow { stroke-dasharray: 4 6; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .fade { animation: fade .8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .blink { animation: blink 3.2s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes twinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(.5); } }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#177F98" stop-opacity=".045"/><stop offset=".6" stop-color="#177F98" stop-opacity="0"/><stop offset="1" stop-color="#F4D35E" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="gSea"><stop offset="0" stop-color="#177F98" stop-opacity=".11"/><stop offset="1" stop-color="#177F98" stop-opacity="0"/></radialGradient>
    <radialGradient id="gSun"><stop offset="0" stop-color="#F4D35E" stop-opacity=".2"/><stop offset="1" stop-color="#F4D35E" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".18" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4D35E" stop-opacity=".75"/><stop offset=".9" stop-color="#F4D35E" stop-opacity=".6"/><stop offset="1" stop-color="#F4D35E" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r=".9" fill="#1F3A4A" fill-opacity=".14"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .12  0 0 0 0 .23  0 0 0 0 .29  .12 0 0 0 -.035"/>
    </filter>
    
  </defs>
  <g transform="rotate(0 380.81 21)"><rect class="sweep" style="animation-delay:0.2s" x="380.81" y="21" width="118.38000000000002" height="9" rx="4.5" fill="url(#marker)"/></g>
  <text x="440" y="28" font-size="20" fill="#1F3A4A" data-w="m" text-anchor="middle">github stats</text>
  <text x="440" y="48" font-size="12" fill="#177F98" text-anchor="middle" letter-spacing="3">きろく</text>
  <circle class="blink" cx="357.8" cy="26" r="3" fill="#F4D35E"/>
  <g transform="translate(341.8 26)"><path class="twinkle" d="M0-6 1.3-1.3 6 0 1.3 1.3 0 6-1.3 1.3-6 0-1.3-1.3Z" fill="#177F98" fill-opacity=".7"/></g>
  <circle cx="327.8" cy="26" r="2.4" fill="none" stroke="#177F98" stroke-opacity=".6" stroke-width="1.2"/>
  <path class="draw" style="animation-delay:.3s" d="M245.8 26 Q 254.6 23 263.3 26 Q 272.1 29 280.8 26 Q 289.6 23 298.3 26 Q 307.1 29 315.8 26" fill="none" stroke="#177F98" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="16.0" y1="26" x2="235.8" y2="26" stroke="#1F3A4A" stroke-opacity=".16" stroke-dasharray="2 5" stroke-linecap="round"/>
  <circle cx="16.0" cy="26" r="2" fill="#1F3A4A" fill-opacity=".2"/>
  <circle class="blink" cx="522.2" cy="26" r="3" fill="#F4D35E"/>
  <g transform="translate(538.2 26)"><path class="twinkle" d="M0-6 1.3-1.3 6 0 1.3 1.3 0 6-1.3 1.3-6 0-1.3-1.3Z" fill="#177F98" fill-opacity=".7"/></g>
  <circle cx="552.2" cy="26" r="2.4" fill="none" stroke="#177F98" stroke-opacity=".6" stroke-width="1.2"/>
  <path class="draw" style="animation-delay:.3s" d="M564.2 26 Q 572.9 23 581.7 26 Q 590.4 29 599.2 26 Q 607.9 23 616.7 26 Q 625.4 29 634.2 26" fill="none" stroke="#177F98" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="644.2" y1="26" x2="864.0" y2="26" stroke="#1F3A4A" stroke-opacity=".16" stroke-dasharray="2 5" stroke-linecap="round"/>
  <circle cx="864.0" cy="26" r="2" fill="#1F3A4A" fill-opacity=".2"/>
</svg>
